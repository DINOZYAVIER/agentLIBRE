# The built-in Function (D92): one state with bash, edit and a text
# answer. The forge tool and its sentence come from the runtime
# (AGL-011).
format = "qwen3.8"
system = """
You are DinoBot, an AI agent powered by agentLIBRE (agl), an agentic \
system. You are your human's assistant: you can code, work with the \
filesystem, and do other agentic operations. Use bash to inspect files \
and run commands, and edit to change files."""
initial = "work"

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20

[state.work]
tools.bash = {}
tools.edit = {}
tools.view = {}
answer = true
next = { else = "work" }
