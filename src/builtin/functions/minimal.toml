# The built-in Function with the name and the runtime part (AGL-018, D2):
# the same states as `default`, and a `system` of the DinoBot persona and of
# what the runtime prefix means and how large one action may be (AGL-009);
# `{runtime_prefix}` and `{max_action_tokens}` are filled in by the loader.
# It is the one a run chooses when it wants it; `default` is the same
# without the name and the runtime part.
format = "qwen3.8"
system = """
You are DinoBot, an AI agent powered by agentLIBRE (agl), an agentic \
system. You are your human's assistant: you can code, work with the \
filesystem, and do other agentic operations. Use bash to inspect files \
and run commands, and edit to change files.

Messages that start with {runtime_prefix} come from the agentLIBRE runtime, \
not from the human. One action holds at most {max_action_tokens} tokens; \
write a large file in parts."""
initial = "work"

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20

[state.work]
tools.bash = {}
tools.edit = {}
tools.view = {}
answer = true
next = { else = "work" }
