# The built-in Function (D92): one state with bash, edit, view and a text
# answer, and the forge tool the runtime adds. Its `system` is laconic and
# nameless (AGL-018): one sentence about agentLIBRE, no name and no runtime
# part. `agentLIBRE` is the same with the name and the runtime part: what the
# runtime prefix means and how large one action may be (AGL-009);
# `{runtime_prefix}` and `{max_action_tokens}` are filled in by the loader.
format = "qwen3.8"
system = "You are an AI agent running on agentLIBRE (agl), an agentic system."
initial = "work"

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20

[state.work]
tools.bash = {}
tools.edit = {}
tools.view = {}
answer = true
next = { else = "work" }
