[package]
name = "agentLIBRE"
version = "0.0.1"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "agentLIBRE -- free and open-source agentic system"
publish = false

# The command is `agentLIBRE` (bf27187).
[[bin]]
name = "agentLIBRE"
path = "src/main.rs"

[dependencies]
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
unicode-width = { version = "0.2", default-features = false }
ureq = { version = "3", default-features = false }
