[package]
name = "agl-lite"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "A coding agent for local models whose state machine drives the grammar"
publish = false

# The command is `agl` (D143).
[[bin]]
name = "agl"
path = "src/main.rs"

[dependencies]
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
unicode-width = { version = "0.2", default-features = false }
ureq = { version = "3", default-features = false }
