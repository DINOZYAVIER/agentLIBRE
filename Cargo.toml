[workspace]
members = ["crates/agentlibre-bridge", "crates/agentlibre-client", "crates/agentlibre-common", "crates/agentlibre-core", "crates/agentlibre-daemon", "crates/agentlibre-forge", "crates/agentlibre-notify", "crates/agentlibre-proto", "crates/agentlibre-surface", "crates/agentlibre-terminal"]
# The chat is built apart, in katarsa-shell's nix-shell (AGL-073 D6, D8).
exclude = ["crates/agentlibre-chat"]
resolver = "3"

# One version for both crates: `about::version` reads it in the core and
# shows what it shows today (AGL-067, D2).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
