[workspace]
members = [
    "crates/agl-daemon-api",
    "crates/agl-execution-api",
    "products/agl-cli",
    "products/services/agl-daemon",
    "products/services/agl-execd",
    "crates/agl-runtime",
    "crates/agl-core",
    "products/agl-matrix-bridge",
]
resolver = "3"

[workspace.package]
version = "1.0.0-alpha.15"
edition = "2024"
license = "LGPL-3.0-or-later"
repository = "https://github.com/agentlibre/agentLIBRE"

[workspace.dependencies]
agl-daemon-api = { path = "crates/agl-daemon-api" }
agl-execution-api = { path = "crates/agl-execution-api" }
agl-daemon = { path = "products/services/agl-daemon" }
agl-execd = { path = "products/services/agl-execd" }
agl-runtime = { path = "crates/agl-runtime" }
agl-core = { path = "crates/agl-core" }
ayeque-forge-core = { git = "https://github.com/DINOZYAVIER/ayeque-forge.git", rev = "509e7df" }
anyhow = "1.0.103"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.2", features = ["derive"] }
crossterm = "0.28.1"
futures-util = { version = "0.3.32", features = ["sink"] }
garde = { version = "0.23.0", features = ["derive"] }
hf-hub = { version = "1.0.0", default-features = false, features = ["rustls-tls"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rustls = "0.23.43"
libc = "0.2.186"
matrix-sdk = { version = "=0.18.0", default-features = false, features = ["bundled-sqlite", "e2e-encryption"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
stemmer = "0.3.2"
rustyline = "18.0.1"
reedline = { version = "0.43.0", features = ["external_printer"] }
nu-ansi-term = "0.50.0"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
semver = { version = "1.0.28", features = ["serde"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
jsonschema = { version = "0.47.0", default-features = false }
sha2 = "0.11.0"
sysinfo = "=0.39.6"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
unicode-width = "0.2.0"
url = "2.5.8"
