name: CI

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AGL_LLAMA_CPP_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout build submodules
        run: git submodule update --init --recursive -- assets/core-skills vendor/llama.cpp

      - name: Install native dependencies
        run: scripts/ci/install-native.sh --target ubuntu-apt

      - name: Install Rust
        run: scripts/ci/install-rustup.sh

      - name: Prepare native libraries
        run: scripts/ci/prepare.sh

      - name: Workspace checks
        run: |
          set +e
          log="$RUNNER_TEMP/workspace-check.log"
          AGL_CI_SKIP_PREPARE=1 scripts/ci/check.sh 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          if ((status != 0)); then
            detail="$(tail -n 30 "$log")"
            detail="${detail//'%'/'%25'}"
            detail="${detail//$'\r'/'%0D'}"
            detail="${detail//$'\n'/'%0A'}"
            printf '::error title=Workspace checks failed::%s\n' "$detail"
            exit "$status"
          fi

      - name: Release CLI smoke
        run: AGL_CI_SKIP_PREPARE=1 scripts/ci/release-smoke.sh
