[backend]
kind = "llama_cpp"
model_id = "gemma4-12b"
multimodal_projector_id = "gemma4-12b-mmproj"

[runtime]
mode = "auto"
max_context_tokens = 65536
max_batch_size = 512
max_ubatch_size = 256
flash_attention = "on"
cache_type_k = "q8_0"
