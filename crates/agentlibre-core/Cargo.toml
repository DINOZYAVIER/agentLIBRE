[package]
name = "agentlibre-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "agentLIBRE core: the agent, the Functions, the backends, the forge and the memory, apart from any terminal"

[features]
# The helpers the tests of the terminal take from the core.
testutil = []

[dependencies]
agentlibre-proto = { path = "../agentlibre-proto" }
base64 = "0.23"
hex = "0.4"
libc = "0.2"
ring = "0.17"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
