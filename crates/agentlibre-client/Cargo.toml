[package]
name = "agentlibre-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "agentLIBRE's side of the daemon's protocol: the socket, hello, the daemon started when none answers, a stop's name, the fold of a conversation (AGL-076, AGL-121 D29)"

# Only `proto` beneath it, so a client that cannot link the core (AGL-076 D2)
# links this instead of repeating it (AGL-121, D29, D65).
[dependencies]
agentlibre-proto = { path = "../agentlibre-proto" }
libc = "0.2"
serde_json = "1"
