[package]
name = "agl-process-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
native-test-fixtures = [
    "dep:agl-exec",
    "dep:agl-process",
    "dep:libc",
    "dep:serde_json",
    "agl-pty/native-test-fixtures",
]

[dependencies]
agl-exec = { workspace = true, optional = true }
agl-process = { workspace = true, optional = true }
agl-pty.workspace = true
libc = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
sha2.workspace = true

[[bin]]
name = "agl-process-launcher"
path = "src/main.rs"

[[bin]]
name = "agl-process-test-helper"
path = "src/bin/agl-process-test-helper.rs"
required-features = ["native-test-fixtures"]

[[bin]]
name = "agl-process-owner-fixture"
path = "src/bin/agl-process-owner-fixture.rs"
required-features = ["native-test-fixtures"]
