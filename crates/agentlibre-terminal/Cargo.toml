[package]
name = "agentLIBRE"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "agentLIBRE -- free and open-source agentic system"

[lib]
name = "agentlibre"

# The commands are `agl` and `agentLIBRE` (bf27187); both run the
# `agentlibre` library.
[[bin]]
name = "agl"
path = "src/bin/agl.rs"

[[bin]]
name = "agentLIBRE"
path = "src/bin/agentLIBRE.rs"

[dependencies]
agentlibre-bridge = { path = "../agentlibre-bridge" }
agentlibre-client = { path = "../agentlibre-client" }
agentlibre-common = { path = "../agentlibre-common" }
agentlibre-core = { path = "../agentlibre-core" }
agentlibre-daemon = { path = "../agentlibre-daemon" }
agentlibre-forge = { path = "../agentlibre-forge" }
agentlibre-proto = { path = "../agentlibre-proto" }
agentlibre-repl = { path = "../agentlibre-repl" }
agentlibre-surface = { path = "../agentlibre-surface" }
qrcode = { version = "0.14.1", default-features = false }
serde_json = "1"

[dev-dependencies]
agentlibre-common = { path = "../agentlibre-common", features = ["testutil"] }
