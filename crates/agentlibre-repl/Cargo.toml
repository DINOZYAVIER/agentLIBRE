[package]
name = "agentlibre-repl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "agentLIBRE -- the terminal's sessions: the REPL, the stdin session, -p"

[dependencies]
agentlibre-client = { path = "../agentlibre-client" }
agentlibre-common = { path = "../agentlibre-common" }
agentlibre-proto = { path = "../agentlibre-proto" }
agentlibre-surface = { path = "../agentlibre-surface" }
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
unicode-width = { version = "0.2", default-features = false }

[dev-dependencies]
agentlibre-common = { path = "../agentlibre-common", features = ["testutil"] }
agentlibre-core = { path = "../agentlibre-core", features = ["testutil"] }
agentlibre-forge = { path = "../agentlibre-forge" }
